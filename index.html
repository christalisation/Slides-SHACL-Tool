<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Slides</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,700|Lato:700">
  <link rel="stylesheet" href="asset/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <script src="asset/remark.min.js"></script>
  <script>
    var source = new URLSearchParams(location.search).get('p') || 'test-slides.md';
    remark.create({ sourceUrl: source, ratio: '16:9', countIncrementalSlides: false }, function () {
      renderMathInElement(document.body, {
        delimiters: [ { left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false } ]
      });
    });
  </script>
</body>
</html>
