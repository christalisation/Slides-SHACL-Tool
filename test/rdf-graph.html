201~200~<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RDF graph</title>
<script src="https://unpkg.com/n3/browser/n3.min.js"></script>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #fff; }
    #graph { position: absolute; inset: 0; }
      #panel { position: absolute; top: 8px; left: 8px; z-index: 10; font-size: 12px; background: rgba(255,255,255,.92);
                 padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; line-height: 1.7; }
                   .sw { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; border: 1px solid #888; }
                     .round { border-radius: 50%; }
                       button, select { margin-top: 4px; font-size: 12px; cursor: pointer; }
                       </style>
                       </head>
                       <body>
                       <div id="graph"></div>
                       <div id="panel">
                         <div><span class="sw round" style="background:#fcd581"></span>Classe</div>
                           <div><span class="sw round" style="background:#a8d1ff"></span>Instance</div>
                             <div><span class="sw" style="background:#f1f1f1"></span>Littéral</div>
                               <select id="layout">
                                   <option value="cose">Organique</option>
                                       <option value="breadthfirst">Arbre</option>
                                           <option value="circle">Cercle</option>
                                               <option value="concentric">Concentrique</option>
                                                   <option value="grid">Grille</option>
                                                     </select><br>
                                                       <button id="fit">Recentrer</button>
                                                         <button id="reset">Réinitialiser</button>
                                                         </div>

                                                         <script>
                                                         const RDF_TYPE = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type';

                                                         function parseTurtle(ttl) {
                                                           return new Promise((resolve, reject) => {
                                                               const quads = [];
                                                                   new N3.Parser().parse(ttl, (err, quad, prefixes) => {
                                                                         if (err) return reject(err);
                                                                               if (quad) quads.push(quad);
                                                                                     else resolve({ quads, prefixes: prefixes || {} });
                                                                                         });
                                                                                           });
                                                                                           }

                                                                                           // Taille approximative des nœuds selon la longueur du texte
                                                                                           const MAXW = 170, CHARW = 7.5;
                                                                                           const nodeW = n => Math.min(n.data('label').length * CHARW, MAXW) + 24;
                                                                                           const nodeH = n => 20 * Math.ceil(n.data('label').length * CHARW / MAXW) + 14;

                                                                                           async function main() {
                                                                                             const src = new URLSearchParams(location.search).get('src') || 'graph.ttl';
                                                                                               const resp = await fetch(src);
                                                                                                 if (!resp.ok) throw new Error('Impossible de charger ' + src);
                                                                                                   const { quads, prefixes } = await parseTurtle(await resp.text());

                                                                                                     const ns = { rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#' };
                                                                                                       for (const [p, v] of Object.entries(prefixes)) ns[p] = typeof v === 'string' ? v : v.value;
                                                                                                         const short = iri => {
                                                                                                             for (const [p, base] of Object.entries(ns)) if (iri.startsWith(base)) return p + ':' + iri.slice(base.length);
                                                                                                                 return iri;
                                                                                                                   };

                                                                                                                     const classes = new Set(quads.filter(q => q.predicate.value === RDF_TYPE).map(q => q.object.value));
                                                                                                                       const elements = [], seen = new Set();

                                                                                                                         const node = term => {
                                                                                                                             const id = term.termType === 'BlankNode' ? '_:' + term.value : term.value;
                                                                                                                                 if (!seen.has(id)) {
                                                                                                                                       seen.add(id);
                                                                                                                                             const kind = classes.has(term.value) ? 'class' : 'instance';
                                                                                                                                                   elements.push({ data: { id, label: term.termType === 'BlankNode' ? id : short(id), kind } });
                                                                                                                                                       }
                                                                                                                                                           return id;
                                                                                                                                                             };

                                                                                                                                                               quads.forEach((q, i) => {
                                                                                                                                                                   const source = node(q.subject);
                                                                                                                                                                       let target, kind;
                                                                                                                                                                           if (q.object.termType === 'Literal') {
                                                                                                                                                                                 target = 'literal-' + i;
                                                                                                                                                                                       elements.push({ data: { id: target, label: q.object.value, kind: 'literal' } });
                                                                                                                                                                                             kind = 'data';
                                                                                                                                                                                                 } else {
                                                                                                                                                                                                       target = node(q.object);
                                                                                                                                                                                                             kind = q.predicate.value === RDF_TYPE ? 'type' : 'object';
                                                                                                                                                                                                                 }
                                                                                                                                                                                                                     elements.push({ data: { id: 'edge-' + i, source, target, label: short(q.predicate.value), kind } });
                                                                                                                                                                                                                       });

                                                                                                                                                                                                                         const cy = cytoscape({
                                                                                                                                                                                                                             container: document.getElementById('graph'),
                                                                                                                                                                                                                                 elements,
                                                                                                                                                                                                                                     style: [
                                                                                                                                                                                                                                           { selector: 'node', style: {
                                                                                                                                                                                                                                                     'label': 'data(label)', 'font-size': 13, 'text-valign': 'center', 'text-halign': 'center',
                                                                                                                                                                                                                                                               'text-wrap': 'wrap', 'text-max-width': MAXW, 'width': nodeW, 'height': nodeH, 'border-width': 1.5 } },
                                                                                                                                                                                                                                                                     { selector: 'node[kind = "class"]',    style: { 'shape': 'ellipse', 'background-color': '#fcd581', 'border-color': '#d4a017' } },
                                                                                                                                                                                                                                                                           { selector: 'node[kind = "instance"]', style: { 'shape': 'ellipse', 'background-color': '#a8d1ff', 'border-color': '#3b82c4' } },
                                                                                                                                                                                                                                                                                 { selector: 'node[kind = "literal"]',  style: { 'shape': 'round-rectangle', 'background-color': '#f1f1f1', 'border-color': '#9a9a9a' } },
                                                                                                                                                                                                                                                                                       { selector: 'edge', style: {
                                                                                                                                                                                                                                                                                                 'label': 'data(label)', 'font-size': 11, 'curve-style': 'bezier', 'width': 1.5,
                                                                                                                                                                                                                                                                                                           'target-arrow-shape': 'triangle', 'text-rotation': 'autorotate',
                                                                                                                                                                                                                                                                                                                     'text-background-color': '#fff', 'text-background-opacity': 1, 'text-background-padding': 2 } },
                                                                                                                                                                                                                                                                                                                           { selector: 'edge[kind = "type"]',   style: { 'line-style': 'dashed', 'line-color': '#d4a017', 'target-arrow-color': '#d4a017' } },
                                                                                                                                                                                                                                                                                                                                 { selector: 'edge[kind = "object"]', style: { 'line-color': '#3b82c4', 'target-arrow-color': '#3b82c4' } },
                                                                                                                                                                                                                                                                                                                                       { selector: 'edge[kind = "data"]',   style: { 'line-color': '#9a9a9a', 'target-arrow-color': '#9a9a9a' } },
                                                                                                                                                                                                                                                                                                                                           ],
                                                                                                                                                                                                                                                                                                                                             });

                                                                                                                                                                                                                                                                                                                                               // Mémorisation des positions (par fichier .ttl)
                                                                                                                                                                                                                                                                                                                                                 const KEY = 'rdf-positions:' + src;
                                                                                                                                                                                                                                                                                                                                                   const save = () => {
                                                                                                                                                                                                                                                                                                                                                       const pos = {};
                                                                                                                                                                                                                                                                                                                                                           cy.nodes().forEach(n => { pos[n.id()] = n.position(); });
                                                                                                                                                                                                                                                                                                                                                               try { localStorage.setItem(KEY, JSON.stringify(pos)); } catch (e) {}
                                                                                                                                                                                                                                                                                                                                                                 };
                                                                                                                                                                                                                                                                                                                                                                   const runLayout = name => {
                                                                                                                                                                                                                                                                                                                                                                       cy.layout({ name, animate: false, padding: 30, idealEdgeLength: 120, nodeRepulsion: 9000, spacingFactor: 1.2 }).run();
                                                                                                                                                                                                                                                                                                                                                                           save();
                                                                                                                                                                                                                                                                                                                                                                             };

                                                                                                                                                                                                                                                                                                                                                                               let saved = null;
                                                                                                                                                                                                                                                                                                                                                                                 try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
                                                                                                                                                                                                                                                                                                                                                                                   if (saved && cy.nodes().every(n => saved[n.id()])) {
                                                                                                                                                                                                                                                                                                                                                                                       cy.layout({ name: 'preset', positions: n => saved[n.id()], padding: 30 }).run();
                                                                                                                                                                                                                                                                                                                                                                                         } else {
                                                                                                                                                                                                                                                                                                                                                                                             runLayout('cose');
                                                                                                                                                                                                                                                                                                                                                                                               }

                                                                                                                                                                                                                                                                                                                                                                                                 cy.on('dragfree', 'node', save);
                                                                                                                                                                                                                                                                                                                                                                                                   document.getElementById('layout').onchange = e => runLayout(e.target.value);
                                                                                                                                                                                                                                                                                                                                                                                                     document.getElementById('fit').onclick = () => cy.fit(undefined, 30);
                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById('reset').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                           try { localStorage.removeItem(KEY); } catch (e) {}
                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById('layout').value = 'cose';
                                                                                                                                                                                                                                                                                                                                                                                                                   runLayout('cose');
                                                                                                                                                                                                                                                                                                                                                                                                                     };
                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                     main().catch(e => {
                                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById('graph').innerHTML = '<p style="color:#c00;padding:120px 20px">' + e.message + '</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                       });
                                                                                                                                                                                                                                                                                                                                                                                                                       </script>
                                                                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                                                                       </html>201~200~<!DOCTYPE html>
