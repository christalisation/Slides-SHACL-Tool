201~200~<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RDF graph</title>
<script src="https://unpkg.com/n3/browser/n3.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; background: #fff; }
    #graph { position: absolute; inset: 0; }
      #panel { position: absolute; top: 8px; left: 8px; font-size: 12px; background: rgba(255,255,255,.92);
                 padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; line-height: 1.7; }
                   .sw { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; border: 1px solid #888; }
                     .round { border-radius: 50%; }
                       button { margin-top: 4px; font-size: 12px; cursor: pointer; }
                       </style>
                       </head>
                       <body>
                       <div id="graph"></div>
                       <div id="panel">
                         <div><span class="sw round" style="background:#fcd581"></span>Classe</div>
                           <div><span class="sw round" style="background:#a8d1ff"></span>Instance</div>
                             <div><span class="sw" style="background:#f1f1f1"></span>Littéral</div>
                               <button id="fit">Recentrer</button>
                               </div>

                               <script>
                               const RDF_TYPE = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type';

                               const STYLE = {
                               	  class:    { shape: 'ellipse', color: { background: '#fcd581', border: '#d4a017' } },
                               	    instance: { shape: 'ellipse', color: { background: '#a8d1ff', border: '#3b82c4' } },
                               	      literal:  { shape: 'box', color: { background: '#f1f1f1', border: '#9a9a9a' }, widthConstraint: { maximum: 170 } },
                               	      };
                               	      const EDGE = {
                               	      	  type:   { dashes: true, color: { color: '#d4a017' } },
                               	      	    object: { color: { color: '#3b82c4' } },
                               	      	      data:   { color: { color: '#9a9a9a' } },
                               	      	      };

                               	      	      function parseTurtle(ttl) {
                               	      	      	  return new Promise((resolve, reject) => {
                               	      	      	  	    const quads = [];
                               	      	      	  	        new N3.Parser().parse(ttl, (err, quad, prefixes) => {
                               	      	      	  	        	      if (err) return reject(err);
                               	      	      	  	        	            if (quad) quads.push(quad);
                               	      	      	  	        	                  else resolve({ quads, prefixes: prefixes || {} });
                               	      	      	  	        	                      });
                               	      	      	  	        	                        });
                               	      	      	  	        	                        }

                               	      	      	  	        	                        async function main() {
                               	      	      	  	        	                        	  const src = new URLSearchParams(location.search).get('src') || 'graph.ttl';
                               	      	      	  	        	                        	    const resp = await fetch(src);
                               	      	      	  	        	                        	      if (!resp.ok) throw new Error('Impossible de charger ' + src);
                               	      	      	  	        	                        	        const { quads, prefixes } = await parseTurtle(await resp.text());

                               	      	      	  	        	                        	          const ns = { rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#' };
                               	      	      	  	        	                        	            for (const [p, v] of Object.entries(prefixes)) ns[p] = typeof v === 'string' ? v : v.value;
                               	      	      	  	        	                        	              const short = iri => {
                               	      	      	  	        	                        	              	    for (const [p, base] of Object.entries(ns)) if (iri.startsWith(base)) return p + ':' + iri.slice(base.length);
                               	      	      	  	        	                        	              	        return iri;
                               	      	      	  	        	                        	              	          };

                               	      	      	  	        	                        	              	            const classes = new Set(quads.filter(q => q.predicate.value === RDF_TYPE).map(q => q.object.value));
                               	      	      	  	        	                        	              	              const nodes = new vis.DataSet(), edges = new vis.DataSet();

                               	      	      	  	        	                        	              	                const node = term => {
                               	      	      	  	        	                        	              	                	    const id = term.termType === 'BlankNode' ? '_:' + term.value : term.value;
                               	      	      	  	        	                        	              	                	        if (!nodes.get(id)) {
                               	      	      	  	        	                        	              	                	        	      const kind = classes.has(term.value) ? 'class' : 'instance';
                               	      	      	  	        	                        	              	                	        	            nodes.add({ id, label: term.termType === 'BlankNode' ? id : short(id), title: id, ...STYLE[kind] });
                               	      	      	  	        	                        	              	                	        	                }
                               	      	      	  	        	                        	              	                	        	                    return id;
                               	      	      	  	        	                        	              	                	        	                      };

                               	      	      	  	        	                        	              	                	        	                        quads.forEach((q, i) => {
                               	      	      	  	        	                        	              	                	        	                        	    const from = node(q.subject);
                               	      	      	  	        	                        	              	                	        	                        	        let to, kind;
                               	      	      	  	        	                        	              	                	        	                        	            if (q.object.termType === 'Literal') {
                               	      	      	  	        	                        	              	                	        	                        	            	      to = 'literal-' + i;
                               	      	      	  	        	                        	              	                	        	                        	            	            nodes.add({ id: to, label: q.object.value, title: short(q.object.datatype.value), ...STYLE.literal });
                               	      	      	  	        	                        	              	                	        	                        	            	                  kind = 'data';
                               	      	      	  	        	                        	              	                	        	                        	            	                      } else {
                               	      	      	  	        	                        	              	                	        	                        	            	                      	      to = node(q.object);
                               	      	      	  	        	                        	              	                	        	                        	            	                      	            kind = q.predicate.value === RDF_TYPE ? 'type' : 'object';
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                }
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                    edges.add({ from, to, label: short(q.predicate.value), ...EDGE[kind] });
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                      });

                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        const network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	    nodes: { font: { size: 14 }, margin: 8 },
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	        edges: { arrows: 'to', font: { size: 11, align: 'middle', background: 'white' }, smooth: { type: 'dynamic' } },
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	            physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { springLength: 110 }, stabilization: { iterations: 300 } },
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                interaction: { hover: true },
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                  });
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    document.getElementById('fit').onclick = () => network.fit();
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    }

                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    main().catch(e => {
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    	  document.getElementById('graph').innerHTML = '<p style="color:#c00;padding:60px 20px">' + e.message + '</p>';
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    	  });
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    	  </script>
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    	  </body>
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    	  </html>
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        	                    })
                               	      	      	  	        	                        	              	                	        	                        	            	                      	                        })
                               	      	      	  	        	                        	              	                	        	                        	            	                      }
                               	      	      	  	        	                        	              	                	        	                        	            }
                               	      	      	  	        	                        	              	                	        	                        })
                               	      	      	  	        	                        	              	                	        }
                               	      	      	  	        	                        	              	                }
                               	      	      	  	        	                        	              }
                               	      	      	  	        	                        }
                               	      	      	  	        })
                               	      	      	  })
                               	      	      }
                               	      }
                               }
