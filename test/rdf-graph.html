<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>RDF graph</title>
    <script src="https://unpkg.com/n3/browser/n3.min.js"></script>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; color: #354046;
        font-family: 'Roboto', 'Segoe UI', sans-serif; font-weight: 300; }
      #graph { position: absolute; inset: 0; }
      #info { display: none; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
        z-index: 10; max-width: calc(100% - 32px); overflow-wrap: anywhere; font-size: 12px;
        background: rgba(255,255,255,.94); padding: 6px 10px; border-radius: 6px;
        box-shadow: 0 1px 3px rgba(0,0,0,.12); }
      #legend { position: absolute; top: 8px; left: 8px; z-index: 10; font-size: 12px; line-height: 1.8;
        background: rgba(255,255,255,.94); padding: 8px 12px; border-radius: 6px;
        box-shadow: 0 1px 3px rgba(0,0,0,.12); max-height: calc(100vh - 32px); overflow: auto; }
      .legend-header { cursor: move; user-select: none; touch-action: none; font-weight: 700; }
      .legend-block { margin: 5px 0 8px; }
      .legend-title { font-weight: 700; margin-top: 4px; }
      .legend-entry { display: flex; align-items: center; gap: 7px; width: 100%; padding: 1px 3px;
        border: 0; border-radius: 3px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
      .legend-entry:hover, .legend-entry.active { background: #e5e1f3; }
      .legend-symbol { display: inline-block; width: 17px; height: 12px; flex: 0 0 17px; box-sizing: border-box; }
      .legend-symbol.iri { border: 2px solid #65717a; border-radius: 4px; }
      .legend-symbol.blank { border: 2px dashed #65717a; border-radius: 4px; }
      .legend-symbol.literal { border: 2px solid #65717a; background: #EDEAF8; }
      .legend-prefix { width: 11px; height: 11px; flex-basis: 11px; border-radius: 50%; }
      .legend-triplet { white-space: nowrap; }
      .legend-hint { margin-top: 5px; font-size: 11px; line-height: 1.4; opacity: .75; }
      .sw { display: inline-block; width: 14px; height: 11px; margin-right: 6px; vertical-align: middle; border-radius: 3px; }
      .ln { display: inline-block; width: 22px; margin-right: 6px; vertical-align: middle; }
      button, select { margin-top: 4px; font: inherit; font-size: 12px; cursor: pointer; color: #354046;
        background: #EDEAF8; border: 1px solid #c9c3e6; border-radius: 4px; padding: 2px 8px; }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="info" aria-live="polite"></div>
    <div id="legend">
      <div class="legend-header">Légende (déplacer)</div>
      <div id="legend-content"></div>
      <select id="layout">
        <option value="cose">Organique</option>
        <option value="breadthfirst">Arbre</option>
        <option value="circle">Cercle</option>
        <option value="concentric">Concentrique</option>
        <option value="grid">Grille</option>
      </select><br>
      <button id="fit">Recentrer</button>
      <button id="reset">Réinitialiser</button>
    </div>

    <script>
    const RDF  = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#';
    const RDFS = 'http://www.w3.org/2000/01/rdf-schema#';
    const OWL  = 'http://www.w3.org/2002/07/owl#';
    const XSD  = 'http://www.w3.org/2001/XMLSchema#';
    const RDF_TYPE = RDF + 'type', SUBCLASS = RDFS + 'subClassOf';
    const CLASS_TYPES = new Set([RDFS + 'Class', OWL + 'Class']);
    const META_TYPES  = new Set([...CLASS_TYPES, RDF + 'Property', OWL + 'ObjectProperty', OWL + 'DatatypeProperty']);
    const DOMAIN = new Set([RDFS + 'domain', 'https://schema.org/domainIncludes', 'http://schema.org/domainIncludes']);
    const RANGE  = new Set([RDFS + 'range',  'https://schema.org/rangeIncludes',  'http://schema.org/rangeIncludes']);
    const isValueType = iri => iri === RDFS + 'Literal' || iri === RDFS + 'Resource' || iri.startsWith(XSD);

    const C = { red: '#812E2B', mint: '#73E8BF', cyan: '#56BDD3', lavender: '#EDEAF8', text: '#354046' };

    function parseTurtle(ttl) {
      return new Promise((resolve, reject) => {
        const quads = [];
        new N3.Parser().parse(ttl, (err, quad, prefixes) => {
          if (err) return reject(err);
          if (quad) quads.push(quad);
          else resolve({ quads, prefixes: prefixes || {} });
        });
      });
    }

    const MAXW = 170, FULL_MAXW = 220, PADDING = 26;
    const MAX = Math.max(1, parseInt(new URLSearchParams(location.search).get('max'), 10) || 24);
    const shorten = s => s.length > MAX ? s.slice(0, MAX - 1) + '…' : s;
    const measure = (() => {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      return (text, size = 13) => {
        context.font = `${size}px Roboto, Segoe UI, sans-serif`;
        return context.measureText(text).width;
      };
    })();
    const labelData = (full, fontSize = 13) => {
      const compact = shorten(full);
      return {
        full,
        short: compact,
        wFull: Math.min(measure(full, fontSize), FULL_MAXW) + PADDING,
        wShort: Math.min(measure(compact, fontSize), MAXW) + PADDING,
        hFull: Math.max(36, 20 * Math.ceil(measure(full, fontSize) / FULL_MAXW) + 16),
        hShort: Math.max(36, 20 * Math.ceil(measure(compact, fontSize) / MAXW) + 16)
      };
    };

    function makeLegendDraggable(SRC) {
      const legend = document.getElementById('legend');
      const handle = legend.querySelector('.legend-header');
      const KEY = 'legend-pos:' + SRC;
      let moved = false;

      const place = (x, y) => {
        const r = legend.getBoundingClientRect();
        x = Math.min(Math.max(0, x), Math.max(0, innerWidth - r.width));
        y = Math.min(Math.max(0, y), Math.max(0, innerHeight - r.height));
        Object.assign(legend.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
      };

      try {
        const p = JSON.parse(localStorage.getItem(KEY));
        if (p) place(p.x, p.y);
      } catch (e) {}

      handle.addEventListener('pointerdown', e => {
        const r = legend.getBoundingClientRect();
        const dx = e.clientX - r.left, dy = e.clientY - r.top;
        const x0 = e.clientX, y0 = e.clientY;
        moved = false;
        handle.setPointerCapture(e.pointerId);

        const onMove = ev => {
          if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) > 3) moved = true;
          if (moved) place(ev.clientX - dx, ev.clientY - dy);
        };
        const onUp = () => {
          handle.removeEventListener('pointermove', onMove);
          if (moved) {
            const r2 = legend.getBoundingClientRect();
            try { localStorage.setItem(KEY, JSON.stringify({ x: r2.left, y: r2.top })); } catch (e) {}
          }
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp, { once: true });
      });

      handle.addEventListener('click', e => {
        if (moved) { e.stopImmediatePropagation(); moved = false; }
      }, true);

      return {
        clamp: () => {
          const r = legend.getBoundingClientRect();
          place(r.left, r.top);
        },
        reset: () => {
          try { localStorage.removeItem(KEY); } catch (e) {}
          place(8, 8);
        }
      };
    }

    async function main() {
      const src = new URLSearchParams(location.search).get('src') || 'graph.ttl';
      const legendPosition = makeLegendDraggable(src);
      const resp = await fetch(src);
      if (!resp.ok) throw new Error('Impossible de charger ' + src);
      const { quads, prefixes } = await parseTurtle(await resp.text());

      const ns = { rdf: RDF, rdfs: RDFS, owl: OWL, xsd: XSD };
      for (const [p, v] of Object.entries(prefixes)) ns[p] = typeof v === 'string' ? v : v.value;
      const namespaces = Object.entries(ns).sort((a, b) => b[1].length - a[1].length);
      const namespaceInfo = iri => {
        for (const [prefix, base] of namespaces) {
          if (iri.startsWith(base)) return { prefix, base, local: iri.slice(base.length) };
        }
        return { prefix: '', base: '', local: iri };
      };
      const short = iri => {
        const info = namespaceInfo(iri);
        return info.prefix ? info.prefix + ':' + info.local : iri;
      };
      const namespacePalette = ['#2563eb', '#ea580c', '#059669', '#7c3aed', '#dc2626',
        '#0891b2', '#ca8a04', '#db2777', '#4f46e5', '#65a30d', '#9333ea', '#0f766e'];
      const usedNamespaceNames = new Set();
      for (const q of quads) {
        for (const term of [q.subject, q.predicate, q.object]) {
          if (term.termType === 'NamedNode') {
            const prefix = namespaceInfo(term.value).prefix;
            if (prefix) usedNamespaceNames.add(prefix);
          }
        }
      }
      const namespaceColors = Object.fromEntries(
        [...usedNamespaceNames].sort().map((prefix, i) => [prefix, namespacePalette[i % namespacePalette.length]])
      );

      // Propriétés décrites par un domaine ET une portée -> dessinées comme flèches domaine -> portée
      const doms = {}, rans = {};
      for (const q of quads) {
        const p = q.predicate.value, s = q.subject.value;
        if (DOMAIN.has(p)) (doms[s] = doms[s] || []).push(q.object.value);
        if (RANGE.has(p))  (rans[s] = rans[s] || []).push(q.object.value);
      }
      const schemaProps = new Set(Object.keys(doms).filter(p => rans[p]));

      // Qu'est-ce qui est une classe ?
      const classes = new Set();
      for (const q of quads) {
        const p = q.predicate.value, o = q.object.value;
        if (p === RDF_TYPE && !META_TYPES.has(o)) classes.add(o);
        if (p === RDF_TYPE && CLASS_TYPES.has(o)) classes.add(q.subject.value);
        if (p === SUBCLASS) { classes.add(q.subject.value); classes.add(o); }
      }
      for (const prop of schemaProps)
        for (const c of [...doms[prop], ...rans[prop]]) if (!isValueType(c)) classes.add(c);

      const elements = [], seen = new Set();
      let counter = 0;
      const node = term => {
        const id = term.termType === 'BlankNode' ? '_:' + term.value : term.value;
        if (!seen.has(id)) {
          seen.add(id);
          const isBlank = term.termType === 'BlankNode';
          const info = isBlank ? { prefix: '', base: '', local: id } : namespaceInfo(id);
          const color = namespaceColors[info.prefix] || '#64748b';
          const label = isBlank ? id : short(id);
          elements.push({ data: { id, iri: id, termKind: isBlank ? 'blank' : 'iri',
            namespace: info.prefix, shape: 'round-rectangle',
            fill: isBlank ? '#f4f5f7' : color, border: isBlank ? '#64748b' : color,
            borderStyle: isBlank ? 'dashed' : 'solid', textColor: isBlank ? C.text : '#fff',
            ...labelData(label) } });
        }
        return id;
      };
      const iriNode = iri => node({ termType: 'NamedNode', value: iri });
      const valueNode = label => {
        const id = 'value-' + (counter++);
        elements.push({ data: { id, termKind: 'literal', namespace: '', shape: 'rectangle',
          fill: C.lavender, border: '#b9b2dd', borderStyle: 'solid', textColor: C.text,
          ...labelData(label) } });
        return id;
      };
      const edge = (source, target, label, kind, predicateIri) => {
        const prefix = namespaceInfo(predicateIri).prefix;
        elements.push({ data: { id: 'edge-' + (counter++), source, target, namespace: prefix,
          color: namespaceColors[prefix] || '#64748b', ...labelData(label, 11), kind } });
      };

      classes.forEach(iriNode);

      for (const q of quads) {
        const p = q.predicate.value;
        if (schemaProps.has(q.subject.value)) continue;                  // dessinée plus bas
        if (p === RDF_TYPE && META_TYPES.has(q.object.value)) continue;  // « X a rdfs:Class » : implicite
        const source = node(q.subject);
        if (q.object.termType === 'Literal') edge(source, valueNode(q.object.value), short(p), 'data', p);
        else edge(source, node(q.object), short(p),
          p === RDF_TYPE ? 'type' : p === SUBCLASS ? 'subclass' : 'object', p);
      }
      for (const prop of schemaProps)
        for (const d of doms[prop])
          for (const r of rans[prop])
            edge(iriNode(d), isValueType(r) ? valueNode(short(r)) : iriNode(r), short(prop),
              isValueType(r) ? 'data' : 'object', prop);

      const cy = cytoscape({
        container: document.getElementById('graph'),
        elements,
        style: [
        { selector: 'node', style: {
            'label': 'data(short)', 'shape': 'data(shape)', 'width': 'data(wShort)', 'height': 'data(hShort)',
            'background-color': 'data(fill)', 'border-color': 'data(border)', 'border-style': 'data(borderStyle)',
            'font-family': 'Roboto, Segoe UI, sans-serif', 'font-size': 13, 'color': 'data(textColor)',
            'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'wrap', 'text-max-width': MAXW,
            'border-width': 1.5 } },
        { selector: 'node.expanded', style: {
            'label': 'data(full)', 'width': 'data(wFull)', 'height': 'data(hFull)', 'z-index': 999,
            'text-wrap': 'wrap', 'text-max-width': FULL_MAXW } },
        { selector: '.focus-muted', style: { 'opacity': 0.12, 'text-opacity': 0.12 } },
        { selector: 'edge', style: {
            'label': 'data(short)', 'font-family': 'Roboto, Segoe UI, sans-serif', 'font-size': 11, 'color': 'data(color)',
            'curve-style': 'bezier', 'width': 2, 'target-arrow-shape': 'triangle', 'text-rotation': 'autorotate',
            'text-background-color': '#fff', 'text-background-opacity': 1, 'text-background-padding': 2 } },
        { selector: 'edge.expanded', style: { 'label': 'data(full)', 'z-index': 999 } },
        { selector: 'edge', style: { 'line-color': 'data(color)', 'target-arrow-color': 'data(color)' } },
        { selector: 'edge[kind = "type"]',     style: { 'line-style': 'dashed' } },
        { selector: 'edge[kind = "subclass"]', style: { 'line-color': C.mint, 'target-arrow-color': C.mint, 'width': 3,
            'target-arrow-fill': 'hollow', 'arrow-scale': 1.4 } },
        ],
      });

      cy.on('mouseover', 'node, edge', e => e.target.addClass('expanded'));
      cy.on('mouseout', 'node, edge', e => {
        if (!e.target.hasClass('pinned')) e.target.removeClass('expanded');
      });
      cy.on('tap', 'node', e => {
        const n = e.target;
        n.toggleClass('pinned');
        n.toggleClass('expanded', n.hasClass('pinned'));
        const info = document.getElementById('info');
        info.textContent = n.data('iri') || n.data('full');
        info.style.display = 'block';
      });

      const legendContent = document.getElementById('legend-content');
      let selectedPrefix = null;
      let hoverFocus = null;
      const applyLegendFocus = () => {
        cy.elements().removeClass('focus-muted');
        const focus = hoverFocus || (selectedPrefix ? { prefix: selectedPrefix } : null);
        if (!focus) return;
        const matching = cy.elements().filter(ele => focus.termKind
          ? ele.isNode() && ele.data('termKind') === focus.termKind
          : ele.data('namespace') === focus.prefix);
        cy.elements().difference(matching).addClass('focus-muted');
      };
      const addBlock = title => {
        const block = document.createElement('div');
        block.className = 'legend-block';
        const heading = document.createElement('div');
        heading.className = 'legend-title';
        heading.textContent = title;
        block.appendChild(heading);
        legendContent.appendChild(block);
        return block;
      };
      const addFocusEntry = (block, label, focus, symbolClass, color, title) => {
        const row = document.createElement('div');
        row.className = 'legend-entry';
        row.title = title || label;
        const symbol = document.createElement('span');
        symbol.className = 'legend-symbol ' + symbolClass;
        if (color) symbol.style.backgroundColor = color;
        const text = document.createElement('span');
        text.textContent = label;
        row.append(symbol, text);
        row.addEventListener('mouseenter', () => { hoverFocus = focus; applyLegendFocus(); });
        row.addEventListener('mouseleave', () => { hoverFocus = null; applyLegendFocus(); });
        block.appendChild(row);
        return row;
      };

      const presentKinds = new Set(cy.nodes().map(n => n.data('termKind')));
      const termsBlock = addBlock('Termes · forme');
      if (presentKinds.has('iri')) addFocusEntry(termsBlock, 'IRI', { termKind: 'iri' }, 'iri');
      if (presentKinds.has('blank')) addFocusEntry(termsBlock, 'Nœud anonyme', { termKind: 'blank' }, 'blank');
      if (presentKinds.has('literal')) addFocusEntry(termsBlock, 'Littéral', { termKind: 'literal' }, 'literal');

      const presentPrefixes = new Set();
      cy.elements().forEach(ele => {
        if (ele.data('namespace')) presentPrefixes.add(ele.data('namespace'));
      });
      if (presentPrefixes.size) {
        const prefixesBlock = addBlock('Espaces de noms · couleur');
        for (const prefix of [...presentPrefixes].sort()) {
          const row = addFocusEntry(prefixesBlock, prefix + ':', { prefix }, 'legend-prefix',
            namespaceColors[prefix] || '#64748b', ns[prefix]);
          row.addEventListener('click', () => {
            selectedPrefix = selectedPrefix === prefix ? null : prefix;
            prefixesBlock.querySelectorAll('.legend-entry').forEach(entry => {
              entry.classList.toggle('active', entry === row && selectedPrefix === prefix);
            });
            applyLegendFocus();
          });
        }
      }

      const tripletBlock = addBlock('Lecture d’un triplet');
      const triplet = document.createElement('div');
      triplet.className = 'legend-triplet';
      triplet.textContent = 'sujet → prédicat → objet';
      tripletBlock.appendChild(triplet);
      const explanation = document.createElement('div');
      explanation.textContent = 'La flèche va du sujet vers l’objet ; l’étiquette est le prédicat (une IRI).';
      tripletBlock.appendChild(explanation);

      const hint = document.createElement('div');
      hint.className = 'legend-hint';
      hint.textContent = 'Survol : mettre en évidence · clic sur un préfixe : filtrer · glisser l’en-tête : déplacer';
      legendContent.appendChild(hint);
      const stats = document.createElement('div');
      stats.className = 'legend-hint';
      stats.textContent = `${quads.length} triplets · ${cy.nodes().length} nœuds`;
      legendContent.appendChild(stats);
      legendPosition.clamp();

      // Mémorisation des positions (par fichier .ttl)
      const KEY = 'rdf-positions:' + src;
      const save = () => {
        const pos = {};
        cy.nodes().forEach(n => { pos[n.id()] = n.position(); });
        try { localStorage.setItem(KEY, JSON.stringify(pos)); } catch (e) {}
      };
      const runLayout = name => {
        cy.layout({ name, animate: false, padding: 30, idealEdgeLength: 120, nodeRepulsion: 9000, spacingFactor: 1.2 }).run();
        save();
      };

      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      if (saved && cy.nodes().every(n => saved[n.id()])) {
        cy.layout({ name: 'preset', positions: n => saved[n.id()], padding: 30 }).run();
      } else {
        runLayout('cose');
      }

      cy.on('dragfree', 'node', save);
      document.getElementById('layout').onchange = e => runLayout(e.target.value);
      document.getElementById('fit').onclick = () => cy.fit(undefined, 30);
      document.getElementById('reset').onclick = () => {
        try { localStorage.removeItem(KEY); } catch (e) {}
        legendPosition.reset();
        document.getElementById('layout').value = 'cose';
        runLayout('cose');
      };
    }

    main().catch(e => {
      document.getElementById('graph').innerHTML = '<p style="color:#812E2B;padding:160px 20px">' + e.message + '</p>';
    });
    </script>
  </body>
</html>
